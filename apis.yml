x-notes:
  api_surface_origin: >-
    binske runs no developer program of its own. The one machine-callable surface
    profiled here — the UCP/MCP endpoint, the /.well-known/ucp discovery
    document, llms.txt and agents.md — is emitted by the Shopify commerce
    platform on behalf of the store. It is recorded because it is genuinely
    served from a binske-controlled host and genuinely callable, not because
    binske publishes an API product. No OpenAPI, SDK, CLI, sandbox, webhook,
    changelog, status page, security.txt or A2A agent card exists on any binske
    host.
