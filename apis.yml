aid: binske
name: Binske
description: >-
  binske is a Colorado-born premium cannabis brand founded in 2015, producing
  flower and pre-rolls, live resin and live hash rosin concentrates, vape carts
  and all-in-ones, and edibles including chocolate bars and fruit gummies, sold
  through licensed dispensaries as a multi-state brand across Colorado, Florida,
  Michigan, New Jersey, New York and Washington. The company develops proprietary
  genetics with ONI Seed Co. and built its chocolate line around rare white cacao
  sourced in Peru, with packaging art by UK artist Martin O'Neill. binske operates
  no developer program and publishes no API of its own; its only machine-callable
  surface is the Shopify-native Universal Commerce Protocol MCP endpoint served
  from its direct-to-consumer storefront at shopbinske.com, which exposes catalog
  search, cart and checkout to agents and requires explicit human approval before
  payment.
