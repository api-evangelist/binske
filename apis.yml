apis:
- name: binske Storefront Commerce API (UCP / MCP)
  description: >-
    Anonymous, publicly callable MCP server on binske's direct-to-consumer
    storefront host implementing the Universal Commerce Protocol shopping
    service. A live JSON-RPC 2.0 tools/list returned 13 tools with full JSON
    Schema draft 2020-12 input schemas covering catalog search and lookup,
    product detail, cart lifecycle, checkout lifecycle and order retrieval.
    complete_checkout carries an idempotency key and requires contemporaneous
    buyer approval. The surface is emitted by the Shopify platform on binske's
    behalf, not authored by binske.
  humanURL: https://shopbinske.com/agents.md
  baseURL: https://shopbinske.com/api/ucp/mcp
